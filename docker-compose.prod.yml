name: mes-production

services:
  # MariaDB Database
  db:
    image: mariadb:11.4
    container_name: mes-db-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./scripts/production/init-database.sql:/docker-entrypoint-initdb.d/init-database.sql:ro
    networks:
      - mes-network
    ports:
      - "3306:3306"
    # healthcheck:
    #   test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    #   start_period: 10s
    #   start_interval: 10s
    #   interval: 1m
    #   timeout: 5s
    #   retries: 3

  # Django Backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: mes-backend-prod
    restart: unless-stopped
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_NAME=${DB_NAME}
      - DATABASE_USER=${DB_USER}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - db
    networks:
      - mes-network
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--deploy"]
      start_period: 30s
      start_interval: 5s
      interval: 1m
      timeout: 10s
      retries: 3

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
    container_name: mes-frontend-prod
    restart: unless-stopped
    volumes:
      - react_build:/usr/share/nginx/html
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    networks:
      - mes-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: mes-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_volume:/var/www/staticfiles:ro
      - media_volume:/var/www/media:ro
      - react_build:/usr/share/nginx/html:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mes-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3

  # SSL Certificate Management
  certbot:
    image: certbot/certbot:latest
    container_name: mes-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - nginx
    command: echo "Skipping..."
    profiles:
      - ssl

networks:
  mes-network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  react_build:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local