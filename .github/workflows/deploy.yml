name: Deploy to Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: test_mes_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Backend 테스트
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.7'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install backend dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Wait for MariaDB
      run: |
        while ! mysqladmin ping -h"127.0.0.1" --silent; do
          sleep 1
        done

    - name: Run backend tests with coverage
      env:
        DATABASE_NAME: test_mes_db
        DATABASE_USER: test_user
        DATABASE_PASSWORD: test_password
        DATABASE_HOST: 127.0.0.1
        DATABASE_PORT: 3306
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: False
      run: |
        cd backend
        pytest --cov=core --cov-report=term-missing --cov-fail-under=70 --tb=short

    # Frontend 빌드 테스트
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      env:
        REACT_APP_API_URL: http://localhost:8000
      run: |
        cd frontend
        npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AWS_EC2_HOST }}
        username: ${{ secrets.AWS_EC2_USER }}
        key: ${{ secrets.AWS_EC2_PRIVATE_KEY }}
        timeout: 600s  # 10분 타임아웃
        script: |
          cd /home/ubuntu/mes-project
          
          # 코드 업데이트
          git fetch origin
          git reset --hard origin/main
          
          # 배포 실행
          chmod +x scripts/production/deploy.sh
          ./scripts/production/deploy.sh
          
          # 배포 결과 확인
          if docker compose -f docker-compose.prod.yml --env-file .env.prod ps | grep -q "Up\|healthy"; then
            echo "✅ Deployment successful!"
            curl -f http://localhost/api/ > /dev/null && echo "✅ API is responding"
          else
            echo "❌ Deployment failed"
            exit 1
          fi

    - name: Notify deployment result
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "🎉 Deployment completed successfully!"
        else
          echo "❌ Deployment failed. Check EC2 logs."
        fi